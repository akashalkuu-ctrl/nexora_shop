
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta name="google-site-verification" content="xVLBWHCG7Ocsslp_2QxrwZd2FmFhr5xEGfj3RHMEH6w" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXORA SHOP | Online Shopping Bangladesh</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f3f8;color:#211b2d;font-family:Arial,sans-serif}
header{background:#24113e;color:white;padding:20px 15px;text-align:center}
header h1{margin:0;color:#d8b5ff;font-size:30px}
header p{margin:7px 0 0}
.search{padding:14px;background:white}
input,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;font-size:15px;margin:5px 0}
.categories{display:flex;gap:8px;overflow:auto;padding:12px;background:white}
.categories button,.add{border:0;border-radius:20px;padding:10px 15px;background:#6e35a8;color:white;white-space:nowrap}
h2{padding:0 14px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px}
.card{background:white;border-radius:13px;overflow:hidden;box-shadow:0 2px 8px #ddd}
.card img{width:100%;height:145px;object-fit:cover}
.info{padding:10px}
.price{color:#6b269e;font-size:19px;font-weight:bold;margin:8px 0}
.add{width:100%;border-radius:8px}
#cart{background:white;margin:12px;padding:15px;border-radius:12px}
.order{background:#24113e;color:white;padding:15px;margin:12px;border-radius:12px}
.order button{width:100%;padding:13px;background:#22b66b;color:white;border:0;border-radius:8px;font-weight:bold}
.contact{display:block;margin:10px 12px;padding:13px;text-align:center;background:#6e35a8;color:white;text-decoration:none;border-radius:9px}
footer{text-align:center;padding:20px;background:#24113e;color:white;margin-top:20px}
</style>
</head>
  <a href="admin.html" style="display:block;background:#9333ea;color:white;padding:14px;text-align:center;border-radius:10px;text-decoration:none;margin:20px;">Admin Login</a>
<body>

<header>
<h1>NEXORA SHOP</h1>
<p>GAMING • MOBILE • ELECTRONICS • LIFESTYLE</p>
</header>

<div class="search">
<input id="search" placeholder="পণ্য খুঁজুন..." oninput="showProducts()">
</div>

<div class="categories">
<button onclick="setCategory('সব')">সব পণ্য</button>
<button onclick="setCategory('Gaming')">Gaming</button>
<button onclick="setCategory('Mobile')">Mobile</button>
<button onclick="setCategory('Electronics')">Electronics</button>
<button onclick="setCategory('Fashion')">Fashion</button>
</div>

<h2>আমাদের পণ্য</h2>
<div class="products" id="products"></div>

<div id="cart">
<h2>🛒 আমার কার্ট</h2>
<div id="cartItems">এখনো কোনো পণ্য যোগ করা হয়নি।</div>
<h3 id="total">মোট: ৳0</h3>
</div>

<div class="order">
<h2>অর্ডার তথ্য</h2>
<input id="customer" placeholder="আপনার নাম">
<input id="phone" placeholder="মোবাইল নম্বর">
<textarea id="address" placeholder="ডেলিভারি ঠিকানা"></textarea>
<button onclick="placeOrder()">WhatsApp-এ অর্ডার করুন</button>
</div>

<a class="contact" href="https://wa.me/8801824697173">মূল WhatsApp: 01824697173</a>
<a class="contact" style="background:#444" href="https://wa.me/8801827635185">বিকল্প WhatsApp: 01827635185</a>

<footer>© 2026 NEXORA SHOP | All Rights Reserved</footer>

<script>
// নতুন পণ্য যোগ করতে এই তালিকায় নতুন তথ্য যোগ করবে।
const products=[
{id:1,name:"Gaming Finger Sleeves",category:"Gaming",price:60,image:"https://images.unsplash.com/photo-1593305841991-05c297ba4575?w=500"},
{id:2,name:"Gaming Headphone",category:"Gaming",price:650,image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"},
{id:3,name:"Mobile Accessories",category:"Mobile",price:150,image:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500"},
{id:4,name:"Wireless Earbuds",category:"Electronics",price:450,image:"https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?w=500"},
{id:5,name:"Fashion Watch",category:"Fashion",price:350,image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"}
];

let cart=[];
let category="সব";

function setCategory(c){
category=c;
showProducts();
}

function showProducts(){
let search=document.getElementById("search").value.toLowerCase();
let list=products.filter(p=>
(category==="সব"||p.category===category)&&
p.name.toLowerCase().includes(search)
);
document.getElementById("products").innerHTML=list.map(p=>`
<div class="card">
<img src="${p.image}" alt="${p.name}">
<div class="info">
<b>${p.name}</b>
<div>${p.category}</div>
<div class="price">৳${p.price}</div>
<button class="add" onclick="addCart(${p.id})">কার্টে যোগ করুন</button>
</div>
</div>`).join("")||"কোনো পণ্য পাওয়া যায়নি।";
}

function addCart(id){
let p=products.find(x=>x.id===id);
let item=cart.find(x=>x.id===id);
if(item)item.qty++;
else cart.push({...p,qty:1});
showCart();
}

function showCart(){
document.getElementById("cartItems").innerHTML=cart.length?
cart.map(p=>`${p.name} × ${p.qty} — ৳${p.price*p.qty}`).join("<br>"):
"এখনো কোনো পণ্য যোগ করা হয়নি।";
let total=cart.reduce((s,p)=>s+p.price*p.qty,0);
document.getElementById("total").innerText="মোট: ৳"+total;
}

function placeOrder(){
if(!cart.length){alert("আগে কার্টে পণ্য যোগ করুন");return;}
let n=document.getElementById("customer").value.trim();
let ph=document.getElementById("phone").value.trim();
let a=document.getElementById("address").value.trim();
if(!n||!ph||!a){alert("সব তথ্য পূরণ করুন");return;}

let details=cart.map(p=>`${p.name} × ${p.qty} = ৳${p.price*p.qty}`).join("\n");
let total=cart.reduce((s,p)=>s+p.price*p.qty,0);
let msg=`NEXORA SHOP ORDER\nনাম: ${n}\nফোন: ${ph}\nঠিকানা: ${a}\n\n${details}\nমোট: ৳${total}`;
window.open("https://wa.me/8801824697173?text="+encodeURIComponent(msg),"_blank");
}

showProducts();
</script>
</body>
</html>
