<script type="module"> 
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {
  getFirestore, collection, onSnapshot
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCkbbEN3rbFpec3r6Zxpn8GXc3sKVqb_Cg",
  authDomain: "nexora-shop-74244.firebaseapp.com",
  projectId: "nexora-shop-74244",
  storageBucket: "nexora-shop-74244.firebasestorage.app",
  messagingSenderId: "536829579657",
  appId: "1:536829579657:web:ca3c6a12cb523c3a0b5158"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let products = [];
let cart = [];
let category = "সব";

window.setCategory = function(c) {
  category = c;
  showProducts();
};

window.showProducts = function() {
  const search = document.getElementById("search").value.toLowerCase();

  const list = products.filter(p =>
    (category === "সব" || p.category === category) &&
    (p.name || "").toLowerCase().includes(search)
  );

  document.getElementById("products").innerHTML = list.map(p => `
    <div class="card">
      <img src="${p.image || 'https://placehold.co/500x350?text=NEXORA+SHOP'}" alt="">
      <div class="info">
        <b>${p.name || ""}</b>
        <div>${p.category || ""}</div>
        <div class="price">৳${p.price || 0}</div>
        <button class="add" onclick="addCart('${p.id}')">কার্টে যোগ করুন</button>
      </div>
    </div>
  `).join("") || "কোনো পণ্য পাওয়া যায়নি।";
};

window.addCart = function(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;

  const item = cart.find(x => x.id === id);
  if (item) item.qty++;
  else cart.push({...p, qty: 1});

  showCart();
};

function showCart() {
  document.getElementById("cartItems").innerHTML = cart.length
    ? cart.map(p => `${p.name} × ${p.qty} — ৳${p.price * p.qty}`).join("<br>")
    : "এখনো কোনো পণ্য যোগ করা হয়নি।";

  const total = cart.reduce((s, p) => s + p.price * p.qty, 0);
  document.getElementById("total").innerText = "মোট: ৳" + total;
}

window.placeOrder = function() {
  if (!cart.length) {
    alert("আগে কার্টে পণ্য যোগ করুন");
    return;
  }

  const n = document.getElementById("customer").value.trim();
  const ph = document.getElementById("phone").value.trim();
  const a = document.getElementById("address").value.trim();

  if (!n || !ph || !a) {
    alert("সব তথ্য পূরণ করুন");
    return;
  }

  const details = cart.map(p =>
    `${p.name} × ${p.qty} = ৳${p.price * p.qty}`
  ).join("\n");

  const total = cart.reduce((s, p) => s + p.price * p.qty, 0);
  const msg = `NEXORA SHOP ORDER\nনাম: ${n}\nফোন: ${ph}\nঠিকানা: ${a}\n\n${details}\nমোট: ৳${total}`;

  window.open("https://wa.me/8801824697173?text=" + encodeURIComponent(msg), "_blank");
};

onSnapshot(collection(db, "products"), snapshot => {
  products = snapshot.docs
    .map(d => ({id: d.id, ...d.data()}))
    .filter(p => p.active === true);

  showProducts();
}, error => {
  document.getElementById("products").textContent =
    "পণ্য লোড হয়নি: " + error.message;
});

showCart();
</script>
</body>
</html>
