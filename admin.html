
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXORA ADMIN</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{background:#151e35;padding:20px;text-align:center}
header h2{color:#55e6c1;margin:0}
.container{max-width:850px;margin:auto;padding:15px}
.panel,.order{background:#151e35;padding:16px;border-radius:12px;margin:14px 0}
input,select,button{width:100%;padding:13px;margin:7px 0;border:0;border-radius:8px;font-size:15px}
input,select{background:#26334e;color:white}
button{background:#20c997;color:#061b19;font-weight:bold}
.logout{background:#e74c3c;color:white}
.hidden{display:none}
.small{color:#bdc9df;line-height:1.8;overflow-wrap:anywhere}
.order h3{color:#55e6c1}
</style>
</head>
<body>
<header>
<h2>NEXORA ADMIN</h2>
<p>SHOP MANAGEMENT PANEL</p>
</header>

<div class="container">
<div class="panel" id="loginBox">
<h3>Admin Login</h3>
<input id="adminEmail" type="email" placeholder="Admin Email">
<input id="adminPassword" type="password" placeholder="Password">
<button id="loginButton">LOGIN</button>
<p id="loginMessage"></p>
</div>

<div id="dashboard" class="hidden">
<div class="panel">
<h3>Dashboard</h3>
<p>মোট অর্ডার: <b id="orderCount">0</b></p>
<p>মোট অর্ডার মূল্য: ৳<b id="salesTotal">0</b></p>
<button class="logout" id="logoutButton">LOGOUT</button>
</div>
<h3>সকল অর্ডার</h3>
<div id="orderList">লোড হচ্ছে...</div>
</div>
</div>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {
getAuth,signInWithEmailAndPassword,
onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

import {
getFirestore,collection,query,orderBy,
onSnapshot,doc,updateDoc
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyCkbbEN3rbFpec3r6Zxpn8GXc3sKVqb_Cg",
authDomain:"nexora-shop-74244.firebaseapp.com",
projectId:"nexora-shop-74244",
storageBucket:"nexora-shop-74244.firebasestorage.app",
messagingSenderId:"536829579657",
appId:"1:536829579657:web:ca3c6a12cb523c3a0b5158"
};

const ADMIN_UID="bsFhoPSLDeMgARABCtSU8DcxdZX2";
const firebaseApp=initializeApp(firebaseConfig);
const auth=getAuth(firebaseApp);
const db=getFirestore(firebaseApp);

const loginBox=document.getElementById("loginBox");
const dashboard=document.getElementById("dashboard");
const orderList=document.getElementById("orderList");
const loginMessage=document.getElementById("loginMessage");

let unsubscribeOrders=null;

function safeText(value){
return String(value ?? "").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#039;"
}[c]));
}

document.getElementById("loginButton").onclick=async()=>{
const email=document.getElementById("adminEmail").value.trim();
const password=document.getElementById("adminPassword").value;

if(!email || !password){
loginMessage.textContent="Email ও Password দাও";
return;
}

try{
await signInWithEmailAndPassword(auth,email,password);
loginMessage.textContent="";
}catch(error){
loginMessage.textContent="Login হয়নি: "+error.message;
}
};

document.getElementById("logoutButton").onclick=()=>{
signOut(auth);
};

onAuthStateChanged(auth,user=>{

if(unsubscribeOrders){
unsubscribeOrders();
unsubscribeOrders=null;
}

if(!user){
loginBox.classList.remove("hidden");
dashboard.classList.add("hidden");
return;
}

if(user.uid!==ADMIN_UID){
alert("এই অ্যাকাউন্ট Admin নয়");
signOut(auth);
return;
}

loginBox.classList.add("hidden");
dashboard.classList.remove("hidden");
loadOrders();
});

function loadOrders(){

const orderQuery=query(
collection(db,"orders"),
orderBy("createdAt","desc")
);

unsubscribeOrders=onSnapshot(orderQuery,snapshot=>{

document.getElementById("orderCount").textContent=snapshot.size;

let total=0;
snapshot.forEach(record=>{
total+=Number(record.data().total||0);
});

document.getElementById("salesTotal").textContent=
total.toLocaleString("en-US");

if(snapshot.empty){
orderList.innerHTML="<p>এখনো কোনো অর্ডার নেই।</p>";
return;
}

orderList.innerHTML=snapshot.docs.map(record=>{

const data=record.data();
const orderId=record.id;

const orderDate=data.createdAt?.toDate
?data.createdAt.toDate().toLocaleString("bn-BD")
:"সময় পাওয়া যায়নি";

const productList=Array.isArray(data.items)
?data.items.map(product=>
`<p>${safeText(product.name)} × ${safeText(product.qty)} — ৳${safeText(product.price)}</p>`
).join("")
:"পণ্যের তথ্য নেই";

return `
<div class="order">
<h3>অর্ডার #${safeText(orderId)}</h3>
<div class="small">
নাম: ${safeText(data.customerName)}<br>
ফোন: ${safeText(data.phone)}<br>
ঠিকানা: ${safeText(data.address)}<br>
পেমেন্ট: ${safeText(data.paymentMethod)}<br>
Transaction ID: ${safeText(data.transactionId||"নেই")}<br>
সময়: ${safeText(orderDate)}
</div>
<hr>
<b>পণ্য:</b>
${productList}
<h3>মোট: ৳${safeText(data.total)}</h3>
<p>বর্তমান Status: ${safeText(data.status)}</p>
<select id="status-${safeText(orderId)}">
<option value="pending">Pending</option>
<option value="confirmed">Confirmed</option>
<option value="processing">Processing</option>
<option value="shipped">Shipped</option>
<option value="delivered">Delivered</option>
<option value="cancelled">Cancelled</option>
</select>
<button data-update-id="${safeText(orderId)}">UPDATE STATUS</button>
</div>
`;
}).join("");

snapshot.docs.forEach(record=>{
const select=document.getElementById("status-"+record.id);
if(select) select.value=record.data().status||"pending";
});

orderList.querySelectorAll("[data-update-id]").forEach(button=>{
button.onclick=async()=>{
const orderId=button.dataset.updateId;
const select=document.getElementById("status-"+orderId);

try{
await updateDoc(doc(db,"orders",orderId),{
status:select.value
});
alert("Status আপডেট হয়েছে");
}catch(error){
alert("আপডেট হয়নি: "+error.message);
}
};
});

},error=>{
orderList.textContent="অর্ডার লোড হয়নি: "+error.message;
});
}
</script>
</body>
</html>
